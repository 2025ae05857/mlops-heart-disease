name: MLOps Heart Disease CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"


    - name: Install Dependencies
      run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 httpx    

    - name: Lint Code Quality with Flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 src/ app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 src/ app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Pytest Unit Test Suite
      run: |
        pytest tests/ -v

    - name: Execute Model Training Pipeline Validation
      run: |
        python src/package_model.py
